version: '3.8'

services:
  water-rl-services:
    build: .
    image: water-rl:latest
    container_name: water-rl-container
    ports:
      - "8501:8501" # Streamlit Dashboard
      - "8000:8000" # FastAPI Inference API
      - "5000:5000" # MLflow UI
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./policies:/app/policies
      - ./mlruns:/app/mlruns
    environment:
      - STREAMLIT_THEME_BASE=light
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

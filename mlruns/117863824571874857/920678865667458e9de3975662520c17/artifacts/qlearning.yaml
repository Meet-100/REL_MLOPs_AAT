agent:
  alpha: 0.1
  epsilon: 1.0
  epsilon_decay: 0.999
  gamma: 0.95
  min_epsilon: 0.01
  seed: 42
environment:
  demand_ranges:
    extreme:
    - 5
    - 60
    normal:
    - 5
    - 20
    peak:
    - 25
    - 45
    shortage:
    - 20
    - 40
    uneven:
    - - 5
      - 10
    - - 15
      - 25
    - - 35
      - 50
  leakage_rate: 0.15
  max_steps: 100
  refill_amount: 30
  reservoir_capacity: 100
  reward_weights:
    overflow: 3.0
    shortage: 1.5
    wastage: 1.0
  scenario_refills:
    extreme: 5
    normal: 30
    peak: 15
    shortage: 3
    uneven: 25
evaluation:
  plots_dir: results/plots
  report_path: results/evaluation_report.md
  seed: 123
  test_episodes: 100
training:
  episodes: 15000
  experiments:
    policy_v1:
      alpha: 0.1
      gamma: 0.95
      name: Standard Learning
    policy_v2:
      alpha: 0.2
      gamma: 0.99
      name: Aggressive Learning
  moving_avg_window: 50
  output_paths:
    logs_dir: logs
    plots_dir: results/plots
    policy_dir: policies
    results_dir: results
